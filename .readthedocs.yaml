# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  apt_packages:
    # git-lfs isn't preinstalled on RTD's build image.
    - git-lfs
  jobs:
    post_checkout:
      # RTD does a shallow, non-LFS clone by default; screenshots in
      # docs/_static are stored via Git LFS and must be pulled explicitly.
      - git lfs install
      - git lfs pull

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
